<svg width="1544" height="658" viewBox="0 0 1544 658" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for realistic 3D physics objects -->
    <radialGradient id="ballGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="85%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </radialGradient>

    <radialGradient id="pinkGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="85%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>

    <linearGradient id="sliderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="pillGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.45" />
    </filter>

    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#f43f5e" flood-opacity="0.4" />
    </filter>

    <clipPath id="clip0_1193_91357">
      <rect width="370" height="150" fill="white" transform="translate(1174 520)" />
    </clipPath>

    <clipPath id="clip1_1193_91357">
      <rect width="393" height="120" fill="white" transform="translate(0 540)" />
    </clipPath>
  </defs>

  <!-- ── 1. Top Right Capsule Rail ── -->
  <rect x="1199" y="261" width="230" height="38" rx="19" stroke="white" stroke-width="10" />
  <rect x="1193.5" y="255.5" width="241" height="49" stroke="#2B4BEE" />
  <rect x="1189" y="251" width="9" height="9" fill="white" stroke="#2B4BEE" stroke-width="2" />
  <rect x="1189" y="300" width="9" height="9" fill="white" stroke="#2B4BEE" stroke-width="2" />
  <rect x="1430" y="251" width="9" height="9" fill="white" stroke="#2B4BEE" stroke-width="2" />
  <rect x="1430" y="300" width="9" height="9" fill="white" stroke="#2B4BEE" stroke-width="2" />

  <!-- Animated Capsule Slider (gliding smoothly inside top track) -->
  <g>
    <rect x="0" y="266" width="56" height="28" rx="14" fill="url(#sliderGradient)" filter="url(#glowFilter)" />
    <circle cx="28" cy="280" r="5" fill="white" opacity="0.85" />
    <animateTransform attributeName="transform" type="translate"
      values="1204 0; 1368 0; 1204 0" dur="4.5s" repeatCount="indefinite"
      keyTimes="0; 0.5; 1" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" calcMode="spline" />
  </g>

  <!-- ── 2. Center Curved Gravity Rail ── -->
  <line x1="972" y1="607.5" x2="572" y2="607.5" stroke="#666666" />
  <rect x="577" y="612" width="9" height="9" transform="rotate(180 577 612)" fill="white" stroke="#2B4BEE" stroke-width="2" />
  <rect x="976" y="612" width="9" height="9" transform="rotate(180 976 612)" fill="white" stroke="#2B4BEE" stroke-width="2" />
  <path d="M524 434C524 434 580.959 607 772 607C963.041 607 1020 434 1020 434" stroke="white" stroke-width="6" stroke-linecap="round" />
  <path d="M524 434C524 434 580.959 607 772 607C963.041 607 1020 434 1020 434" stroke="#2B4BEE" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <circle cx="772" cy="607" r="8" fill="#2B4BEE" stroke="white" stroke-width="4" />
  <circle cx="524" cy="434" r="7" fill="white" stroke="#2B4BEE" stroke-width="4" />
  <circle cx="1020" cy="434" r="7" fill="white" stroke="#2B4BEE" stroke-width="4" />

  <!-- Animated Rolling Physics Ball (rolling back and forth along curved track with gravity physics) -->
  <g>
    <circle r="26" fill="url(#ballGradient)" filter="url(#glowFilter)" />
    <circle r="7" cx="-7" cy="-7" fill="white" opacity="0.75" />
    <animateMotion dur="3.8s" repeatCount="indefinite"
      path="M 545 440 C 600 592, 944 592, 999 440 C 944 592, 600 592, 545 440"
      keyTimes="0; 0.5; 1" keySplines="0.38 0 0.62 1; 0.38 0 0.62 1" calcMode="spline" />
  </g>

  <!-- ── 3. Bottom Right See-Saw Balance Beam ── -->
  <g clip-path="url(#clip0_1193_91357)">
    <!-- Fulcrum Triangle & Center Pivot Circle -->
    <polygon points="1350,650 1374,650 1362,632" fill="#666666" />
    <circle cx="1362" cy="632" r="16" stroke="white" stroke-width="8" fill="#111111" />

    <!-- Rocking Beam with counterbalanced weights on both ends -->
    <g>
      <!-- The Beam -->
      <rect x="1181" y="622" width="362" height="20" rx="10" fill="white" stroke="#2B4BEE" stroke-width="2" />
      <circle cx="1195" cy="632" r="5" fill="#2B4BEE" />
      <circle cx="1529" cy="632" r="5" fill="#2B4BEE" />

      <!-- Left Weight: Pink Pill on See-saw -->
      <rect x="1200" y="598" width="50" height="24" rx="12" fill="url(#pillGradient)" filter="url(#pinkGlow)" />
      <circle cx="1225" cy="610" r="4" fill="white" opacity="0.8" />

      <!-- Right Weight: Blue Sphere on See-saw -->
      <circle cx="1515" cy="608" r="15" fill="url(#ballGradient)" filter="url(#glowFilter)" />
      <circle cx="1510" cy="603" r="4" fill="white" opacity="0.8" />

      <!-- Smooth Rocking Animation centered on Fulcrum (1362, 632) -->
      <animateTransform attributeName="transform" type="rotate"
        values="-12 1362 632; 9 1362 632; -12 1362 632" dur="4.6s" repeatCount="indefinite"
        keyTimes="0; 0.5; 1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" calcMode="spline" />
    </g>
  </g>

  <!-- ── 4. Left Bezier Curve with Control Handles ── -->
  <rect width="28" height="120" transform="matrix(0.173648 0.984808 0.984808 -0.173648 470.479 106.631)" fill="white" opacity="0.15" />
  <line x1="350.001" y1="171.782" x2="270.001" y2="33.2182" stroke="#666666" />
  <rect x="268.604" y="39.7983" width="9" height="9" transform="rotate(-120 268.604 39.7983)" fill="white" stroke="#2B4BEE" stroke-width="2" />
  <rect x="348.104" y="177.496" width="9" height="9" transform="rotate(-120 348.104 177.496)" fill="white" stroke="#2B4BEE" stroke-width="2" />
  <path d="M8 8C8 8 8 78 90.9992 148C173.998 218 351.999 175 310.999 105C269.999 35 90.9992 118 215 363" stroke="white" stroke-width="5" stroke-linecap="round" />
  <path d="M8 8C8 8 8 78 90.9992 148C173.998 218 351.999 175 310.999 105C269.999 35 90.9992 118 215 363" stroke="#2B4BEE" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <circle cx="8" cy="8" r="6" fill="white" stroke="#2B4BEE" stroke-width="4" />
  <circle cx="214" cy="361" r="6" fill="white" stroke="#2B4BEE" stroke-width="4" />
  <circle cx="310" cy="102" r="8" fill="#2B4BEE" stroke="white" stroke-width="4" />

  <!-- Animated Glowing Orb gliding along the Bezier curve -->
  <g>
    <circle r="16" fill="url(#pinkGradient)" filter="url(#pinkGlow)" />
    <circle r="5" cx="-4" cy="-4" fill="white" opacity="0.8" />
    <animateMotion dur="5.6s" repeatCount="indefinite"
      path="M 8 8 C 8 78, 173 218, 310 105 C 270 35, 90 118, 215 363 C 90 118, 270 35, 310 105 C 173 218, 8 78, 8 8"
      keyTimes="0; 0.5; 1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" calcMode="spline" />
  </g>

  <!-- ── 5. Bottom Left Angled Slider Ramp ── -->
  <g clip-path="url(#clip1_1193_91357)">
    <rect x="165.967" y="545.078" width="245" height="33" rx="16.5" transform="rotate(20 165.967 545.078)" stroke="#EE2B6C" stroke-width="3" />
    <circle cx="175.828" cy="566.226" r="10" transform="rotate(20 175.828 566.226)" stroke="white" stroke-width="4" />
    <circle cx="175.828" cy="566.226" r="4" transform="rotate(20 175.828 566.226)" fill="white" />
    <circle cx="375.043" cy="638.735" r="10" transform="rotate(20 375.043 638.735)" stroke="white" stroke-width="4" />
    <circle cx="375.043" cy="638.734" r="4" transform="rotate(20 375.043 638.734)" fill="white" />
    <rect x="5.5" y="603.5" width="194" height="49" stroke="#2B4BEE" />
    <rect x="11" y="609" width="183" height="38" rx="19" stroke="white" stroke-width="10" />

    <!-- Animated marble rolling up and down the angled ramp -->
    <g>
      <circle r="13" fill="#ffffff" filter="url(#glowFilter)" />
      <circle r="4" cx="-3" cy="-3" fill="#2B4BEE" />
      <animateMotion dur="3.4s" repeatCount="indefinite"
        path="M 180 567 L 370 636 L 180 567"
        keyTimes="0; 0.5; 1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" calcMode="spline" />
    </g>
  </g>

  <!-- ── 6. Center Goal Target & Animated Flag ── -->
  <rect x="682.5" y="186.5" width="179" height="179" fill="#1A1A1A" stroke="#666666" stroke-dasharray="5 5" rx="12" />
  <rect x="722" y="226" width="100" height="100" fill="white" rx="8" />

  <!-- Animated Green Check Badge (gentle breathing pulse) -->
  <g>
    <circle cx="772" cy="276" r="28" fill="#00CC76" />
    <path d="M761 277.373L767.101 284.171C767.498 284.614 768.192 284.614 768.589 284.171L784 267" stroke="white" stroke-width="6" stroke-linecap="round" />
    <animateTransform attributeName="transform" type="scale"
      values="1; 1.06; 1" dur="2.8s" repeatCount="indefinite"
      additive="sum" />
  </g>

  <rect x="770" y="118" width="4" height="108" fill="#E6E6E6" />

  <!-- Animated Waving Flag -->
  <path d="M774 122H822L812 138L822 154H774V122Z" fill="#00CC76">
    <animate attributeName="d"
      values="M774 122H822L812 138L822 154H774V122Z; M774 122H828L818 138L826 154H774V122Z; M774 122H822L812 138L822 154H774V122Z"
      dur="2.4s" repeatCount="indefinite" />
  </path>
</svg>
